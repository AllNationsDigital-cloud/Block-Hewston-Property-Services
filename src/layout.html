<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#F2EADA">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{config.name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{config.url}}/img/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script>document.documentElement.classList.add('js')</script>
<script type="application/ld+json">{{schema}}</script>
{{extraHead}}
{{analytics}}
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="/" aria-label="{{config.name}}, home"><img src="/img/logo-dark.png" width="600" height="274" alt="Block &amp; Hewston"><span>Property Services</span></a>
    <nav id="site-nav" class="nav" aria-label="Primary">
      <ul>
        {{nav}}
      </ul>
      <a class="btn btn--dark nav__cta" href="/quote/">Get a quote</a>
    </nav>
    <a class="callbtn" href="tel:{{config.phoneTel}}" aria-label="Call {{config.phone}}">Call</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav"><span class="menu-btn__bars" aria-hidden="true"></span><span class="sr">Menu</span></button>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap foot">
    <div>
      <img src="/img/logo-gold.png" width="600" height="274" alt="Block &amp; Hewston" class="foot__logo">
      <p>Property Services · Shreveport, Louisiana<br>A <a href="{{config.parentUrl}}" rel="noopener">Block &amp; Hewston</a> company</p>
    </div>
    <p><a href="tel:{{config.phoneTel}}">{{config.phone}}</a><br><a href="mailto:{{config.email}}">{{config.email}}</a><br>{{config.hours}}</p>
    <p><a href="/services/">Services</a><br><a href="/pricing/">Pricing</a><br><a href="/service-area/">Service area</a><br><a href="/faq/">FAQ</a></p>
    <p><a href="/privacy/">Privacy</a><br><a href="/terms/">Terms</a><br>© {{year}}</p>
  </div>
</footer>
<script src="/js/site.js" defer></script>
</body>
</html>
