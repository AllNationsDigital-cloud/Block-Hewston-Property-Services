<!--{"title":"Before & After Gallery | Make-Ready Results in Shreveport-Bossier","description":"See before and after results from rental turnover cleaning, cleanouts and painting. Drag the slider to compare.","nav":"gallery"}-->
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">Gallery</p>
    <h1>Before. After. Documented.</h1>
    <p class="lede">Drag the handle, or focus a slider and use your arrow keys, to compare each unit.</p>
  </div>
</section>
<section class="section">
  <div class="wrap">
    <p class="callout" style="margin-bottom:2.5rem"><b>Placeholder images.</b> [REPLACE with real before/after photos from completed jobs. Use matching camera position and orientation. See README → Images.]</p>
    <div class="grid grid--2">
      <figure class="gal-item reveal" style="margin:0">
        <div class="ba">
          <img class="ba__after" src="/img/after-living.svg" width="1200" height="800" loading="lazy" alt="After: freshly painted living room, clean floors and clear window">
          <img class="ba__before" src="/img/before-living.svg" width="1200" height="800" loading="lazy" alt="Before: scuffed, marked walls and stained floor with left-behind boxes">
          <span class="ba__tag ba__tag--before">Before</span><span class="ba__tag ba__tag--after">After</span>
          <span class="ba__handle" aria-hidden="true"></span>
          <input class="ba__range" type="range" min="0" max="100" value="50" aria-label="Compare before and after, living room repaint">
        </div>
        <figcaption class="gal-cap"><b>Living room repaint</b>Patch, prime, two coats and detail clean. [Unit type · days on site]</figcaption>
      </figure>
      <figure class="gal-item reveal" style="margin:0">
        <div class="ba">
          <img class="ba__after" src="/img/after-kitchen.svg" width="1200" height="800" loading="lazy" alt="After: spotless kitchen with clean counters and cabinets">
          <img class="ba__before" src="/img/before-kitchen.svg" width="1200" height="800" loading="lazy" alt="Before: kitchen with grime on counters and cabinets and clutter on the counter">
          <span class="ba__tag ba__tag--before">Before</span><span class="ba__tag ba__tag--after">After</span>
          <span class="ba__handle" aria-hidden="true"></span>
          <input class="ba__range" type="range" min="0" max="100" value="50" aria-label="Compare before and after, kitchen turnover cleaning">
        </div>
        <figcaption class="gal-cap"><b>Kitchen turnover clean</b>Cabinets, counters, appliances and floors. [Unit type · hours on site]</figcaption>
      </figure>
      <figure class="gal-item reveal" style="margin:0">
        <div class="ba">
          <img class="ba__after" src="/img/after-cleanout.svg" width="1200" height="800" loading="lazy" alt="After: empty, swept room ready for cleaning and paint">
          <img class="ba__before" src="/img/before-cleanout.svg" width="1200" height="800" loading="lazy" alt="Before: room filled with left-behind boxes and furniture">
          <span class="ba__tag ba__tag--before">Before</span><span class="ba__tag ba__tag--after">After</span>
          <span class="ba__handle" aria-hidden="true"></span>
          <input class="ba__range" type="range" min="0" max="100" value="50" aria-label="Compare before and after, unit cleanout">
        </div>
        <figcaption class="gal-cap"><b>Unit cleanout</b>Furniture and debris removed, hauled and swept. [Unit type · same-day]</figcaption>
      </figure>
    </div>
  </div>
</section>
{{> cta}}
